<style>
  :root { --green: #1E4D2B; --light: #EAF4E4; --mid: #D9EAD3; --ink: #1d1d1d; --muted: #6b6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: #f4f5f2; }

  .nb { display: inline-block; min-width: 24px; padding: 2px 0; border-radius: 6px; font-weight: 700; }

  .en-plbl { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 12px; text-transform: uppercase; letter-spacing: .04em; }

  <section id="tonight">

<script>
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function thr(t) { return t ? '<div class="thr' + (t === 'F' ? ' f' : '') + '">' + esc(t) + '</div>' : ''; }
  function num(s) { var n = parseFloat(s); return isNaN(n) ? null : n; }
  // Payouts (Ty, Nov 14). Regular season: by standings place; players tied on points share the combined pot of the places they cover.
  var SEASON_PAY = [180, 130, 80], PLAYOFF_PAY = [210, 150, 90];
  function money(v) { return '$' + (Math.round(v * 100) % 100 ? v.toFixed(2) : String(Math.round(v))); }
  function seasonPay(rows) {
    var out = rows.map(function () { return 0; }), i = 0;
    out.tied = rows.map(function () { return 0; });
    while (i < rows.length && i < SEASON_PAY.length) {
      var p = num(rows[i].pts), j = i + 1;
      while (p !== null && j < rows.length && num(rows[j].pts) === p) j++;
      var pot = 0;
      for (var k = i; k < j; k++) pot += SEASON_PAY[k] || 0;
      for (k = i; k < j; k++) { out[k] = pot / (j - i); out.tied[k] = j - i > 1 ? i + 1 : 0; }
      i = j;
    }
    return out;
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var data = null;
  function teeOf(t) {
    var ti = data && data.teeInfo; if (!ti || !t) return null;
    return ti.tees.filter(function (x) { return x.tee === t; })[0] || null;
  }
  function yds(n) { return n === '' || n == null ? '' : Number(n).toLocaleString('en-US'); }
  function renderTeeStrip() {
    var el0 = document.getElementById('teestrip'); if (el0) { el0.classList.add('hide'); el0.innerHTML = ''; } return;   // removed from the Board (Nov 12)
    var el = document.getElementById('teestrip'), ti = data && data.teeInfo;
    var tees = ti ? ti.tees.filter(function (x) { return x.yards || x.color; }) : [];
    el.classList.toggle('hide', !tees.length);
    el.innerHTML = tees.map(function (x) {
      return '<div class="ts"><span class="dot" style="background:' + esc(x.color.toLowerCase()) + '"></span>' +
        '<div><div class="tn">' + esc(x.tee) + (x.color ? ' <i>' + esc(x.color) + '</i>' : '') + '</div><div class="ty">' + (x.yards ? yds(x.yards) + ' yds' : '') + '</div></div></div>';
    }).join('');
  }

  // Tabs (Nov 13): Board = Head2Head / Team / Individual; Scores = Enter score / Scorecards / Handicaps / Stats;
  // Admin (Ty only) = Enter score for anyone + self-entry switches / Schedule admin.
  var SHOW = { adminenter: ['entrysw', 'enter'] };
  var curTab = '';
  function groupOf(tab) {
    var b = [].filter.call(document.querySelectorAll('nav.tabbar [data-group]'), function (x) { return x.dataset.group.split(' ').indexOf(tab) >= 0; })[0];
    return b ? b.dataset.tab : '';
  }
  function isAdmin() { var a = window.RL && RL.user(); return !!(a && a.admin); }
  function entryOn(n) { var e = data && data.entry; return !e || !e.on ? true : !!e.on[n]; }
  function canSelfEnter() { var a = window.RL && RL.user(); return !!a && entryOn(a.name); }  // Nov 13: admins follow their own switch too
  function boardPicked() { var p = null; try { p = JSON.parse(store('boardPick') || 'null'); } catch (e) {} return p && data && p.n === data.title ? p.t : ''; }
  function boardDefault() { return boardPicked() || (data && data.roundType === 'Casual' ? 'field' : 'tonight'); }
  function resolveTab(tab) {
    if (tab === 'board') return boardDefault();
    if (tab === 'scores') { var s0 = store('scoresTab'); return s0 && s0 !== 'enter' ? s0 : (canSelfEnter() ? 'enter' : 'cards'); }
    if (tab === 'admin') return store('adminTab') || 'adminenter';
    if (tab === 'news') return store('newsTab') || 'newsres';
    if (tab === 'stand') return store('standTab') || 'standings';
    if (tab === 'enter' && !canSelfEnter()) return 'cards';
    if (/^admin/.test(tab) && !isAdmin()) return boardDefault();
    return document.getElementById(tab) || SHOW[tab] ? tab : boardDefault();
  }
  function showTab(tab, auto) {
    tab = resolveTab(tab);
    var grp = groupOf(tab), show = SHOW[tab] || [tab];
    curTab = tab;
    document.querySelectorAll('nav.tabbar button').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === tab || x.dataset.tab === grp); });
    document.querySelectorAll('nav.subnav').forEach(function (n) { n.classList.toggle('hide', n.dataset.for !== grp); });
    document.querySelectorAll('nav.subnav button').forEach(function (x) { x.classList.toggle('on', x.dataset.tab === tab); });
    document.querySelectorAll('main section').forEach(function (s) { s.classList.toggle('hide', show.indexOf(s.id) < 0); });
    store('tab', tab);
    if (grp === 'board' && !auto && data) store('boardPick', JSON.stringify({ n: data.title, t: tab }));
    if (grp === 'scores') store('scoresTab', tab);
    if (grp === 'admin') store('adminTab', tab);
    if (grp === 'news') store('newsTab', tab);
    if (grp === 'stand') store('standTab', tab);
    var tbOn = document.querySelector('nav.tabbar button.on'); if (tbOn && tbOn.scrollIntoView) try { tbOn.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
    var wasAdminEnter = window.ADMIN_ENTER, wasTeeAdmin = window.TEE_ADMIN;
    window.ADMIN_ENTER = tab === 'adminenter';
    window.TEE_ADMIN = tab === 'adminsched';
    if (data) {
      if (tab === 'hcp') renderHcp();
      if (window.ADMIN_ENTER !== wasAdminEnter && typeof renderEntry === 'function') { entry.who = ''; renderEntry(); }
      if (window.ADMIN_ENTER) renderEntrySw();
      if (window.TEE_ADMIN !== wasTeeAdmin && window.renderTee) renderTee();
      if (tab === 'adminmsg' && window.renderMsg) renderMsg(true);
    }
    var on = document.querySelector('nav.subnav button[data-tab="' + tab + '"]') || document.querySelector('nav.tabbar button[data-tab="' + tab + '"]');
    if (on) document.getElementById('curtab').textContent = on.textContent;
    setMenu(false);
  }
  // Team game card: tap for the full rules (rules.js).
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest || !ev.target.closest('#grulesbtn')) return;
    window.rulesOpen = !window.rulesOpen;
    var r = document.getElementById('grules'), b = document.getElementById('grulesbtn');
    if (r) r.classList.toggle('hide', !window.rulesOpen);
    if (b) { b.setAttribute('aria-expanded', window.rulesOpen); b.querySelector('.gmore').textContent = window.rulesOpen ? 'Hide rules ▴' : 'Rules ›'; }
  });
  // Head2Head view: Basic (names, Thru and scores only, so every match fits on one screen) or Detailed. Per phone; starts Detailed.
  function setH2hView(v) {
    v = v === 'basic' ? 'basic' : 'detailed'; store('h2hView', v);
    document.getElementById('matches').classList.toggle('h2h-basic', v === 'basic');
    document.querySelectorAll('[data-h2h]').forEach(function (b) { var on = b.getAttribute('data-h2h') === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  }
  document.querySelectorAll('[data-h2h]').forEach(function (b) { b.addEventListener('click', function () { setH2hView(b.getAttribute('data-h2h')); }); });
  setH2hView(store('h2hView'));
  // Admin tab only for admins; Enter score pill only for players allowed to enter their own scores.
  window.updateNav = function () {
    document.getElementById('adminbtn').classList.toggle('hide', !isAdmin());
    var tb = document.querySelector('nav.tabbar'); if (tb) { var more = function () { tb.classList.toggle('more', tb.scrollWidth - tb.clientWidth - tb.scrollLeft > 4); }; more(); if (!tb.dataset.mw) { tb.dataset.mw = 1; tb.addEventListener('scroll', more, { passive: true }); window.addEventListener('resize', more); } }
    document.getElementById('enterpill').classList.toggle('hide', !canSelfEnter());
    if (curTab && resolveTab(curTab) !== curTab) showTab(curTab, true);
  };
  function setMenu(open) {
    document.querySelector('header').classList.toggle('open', open);
    document.getElementById('menubtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    document.getElementById('menubtn').textContent = open ? '✕' : '☰';
  }
  document.getElementById('menubtn').addEventListener('click', function () {
    setMenu(!document.querySelector('header').classList.contains('open'));
  });
  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () { showTab(b.dataset.tab); });
  });
  var lastTab = store('tab');
  showTab(lastTab && (document.getElementById(lastTab) || SHOW[lastTab]) ? lastTab : 'board', true);

  // One "me" pick shared by Schedule, ScoreCards, Enter Score and Player Handicaps.
  if (store('me') === null) {
    var oldPick = store('who') || store('card') || store('enwho') || store('hcp');
    if (oldPick) store('me', oldPick);
  }
  var meName = store('me') || '';
  function me() { return meName; }
  function setMe(name) {
    meName = name || ''; store('me', meName);
    if (!data) return;
    renderSchedule(); renderCard(); renderEntry(); renderHcp();
  }
  document.getElementById('who').addEventListener('change', function () { setMe(this.value); });

  function renderSchedule() {
    var list = (data && data.schedule) || [];
    var sel = document.getElementById('who');
    var want = me();
    var names = list.map(function (p) { return p.name; });
    var opts = '<option value="">Choose a player…</option>' + names.map(function (n) {
      return '<option' + (n === want ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
    if (sel.dataset.opts !== names.join('|')) { sel.innerHTML = opts; sel.dataset.opts = names.join('|'); }
    sel.value = names.indexOf(want) >= 0 ? want : '';

    var p = list.filter(function (x) { return x.name === sel.value; })[0];
    if (!p) {
      document.getElementById('schedsum').textContent = '';
      document.getElementById('weeks').innerHTML = '<div class="empty">Pick a name to see their schedule</div>';
      return;
    }
    var w = 0, l = 0, t = 0;
    p.weeks.forEach(function (x) { if (x.status === 'W') w++; if (x.status === 'L') l++; if (x.status === 'T') t++; });
    document.getElementById('schedsum').textContent = 'Record ' + w + '-' + l + '-' + t + ' (W-L-T)';
    var label = { W: 'W', L: 'L', T: 'T', bye: 'Bye', makeup: 'Makeup', pending: 'Pending', upcoming: '' };
    document.getElementById('weeks').innerHTML = p.weeks.map(function (x) {
      var bye = x.status === 'bye';
      return '<div class="wk' + (x.next ? ' next' : '') + (bye ? ' bye' : '') + '">' +
        '<div class="when"><div class="date">' + esc(x.date) + '</div>' + (x.next ? '<div class="tag">Next</div>' : '') + '</div>' +
        '<div class="what"><div class="opp">' + (bye ? 'Bye' : 'vs ' + esc(x.opp)) + '</div>' +
          '<div class="course">' + esc(x.course) + '</div></div>' +
        '<div class="res">' + (label[x.status] ? '<span class="chip ' + x.status + '">' + label[x.status] + '</span>' : '') +
          (x.score ? '<div class="score">' + esc(x.score) + ' STBF</div>' : '') + '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('cardwho').addEventListener('change', function () { setMe(this.value); });

  function n(v) { var x = parseFloat(v); return isNaN(x) ? null : x; }
  function sum(list, key) {
    var t = 0, any = false;
    list.forEach(function (h) { var x = n(h[key]); if (x !== null) { t += x; any = true; } });
    return any ? t : '';
  }
  function netClass(h) {
    var nv = n(h.n), pv = n(h.par);
    if (nv === null || pv === null) return '';
    var d = nv - pv;
    return d <= -2 ? 'eagle' : d === -1 ? 'birdie' : d === 0 ? '' : d === 1 ? 'bogey' : 'double';
  }

  function cardTable(label, holes, totals, yards) {
    var head = '<tr class="hole"><td class="rl">Hole</td>' + holes.map(function (h) { return '<td>' + h.hole + '</td>'; }).join('') +
      totals.map(function (t) { return '<td class="tot">' + t.label + '</td>'; }).join('') + '</tr>';
    function row(name, cls, cell, totKey) {
      return '<tr class="' + cls + '"><td class="rl">' + name + '</td>' + holes.map(cell).join('') +
        totals.map(function (t) { return '<td class="tot">' + (totKey ? esc(sum(t.holes, totKey)) : '') + '</td>'; }).join('') + '</tr>';
    }
    return '<div class="card">' + (label ? '<div class="sc-lbl">' + label + '</div>' : '') + '<table class="sc">' + head +
      (yards ? '<tr class="sub yds"><td class="rl">Yds</td>' + holes.map(function (h) { return '<td>' + esc(yards[h.hole - 1]) + '</td>'; }).join('') +
        totals.map(function (t) { var y = 0; t.holes.forEach(function (h) { y += Number(yards[h.hole - 1]) || 0; }); return '<td class="tot">' + (y ? yds(y) : '') + '</td>'; }).join('') + '</tr>' : '') +
      row('Par', 'sub', function (h) { return '<td>' + esc(h.par) + '</td>'; }, 'par') +
      row('Hcp', 'sub', function (h) { return '<td>' + esc(h.idx) + '</td>'; }, '') +
      row('Gross', '', function (h) {
        var s = n(h.s) || 0;
        return '<td class="g">' + esc(h.g) + (s > 0 ? '<span class="dots">' + new Array(s + 1).join('•') + '</span>' : '') + '</td>';
      }, 'g') +
      row('Net', '', function (h) {
        return '<td>' + (h.n !== '' ? '<span class="nb ' + netClass(h) + '">' + esc(h.n) + '</span>' : '') + '</td>';
      }, 'n') +
      row('STBF', '', function (h) { return '<td>' + esc(h.p) + '</td>'; }, 'p') +
      row('Putts', 'putts', function (h) { return '<td>' + esc(h.pt) + '</td>'; }, 'pt') +
      (holes.some(function (h) { return n(h.pen); }) ? row('Pen', 'sub', function (h) { return '<td>' + esc(h.pen) + '</td>'; }, 'pen') : '') +
      (holes.some(function (h) { return n(h.m); }) ? row('Mull', 'sub', function (h) { return '<td>' + esc(h.m) + '</td>'; }, 'm') : '') +
      '</table></div>';
  }

  // Scorecards can show tonight or any earlier posted night (Nov 13). Past nights come from the Round Log
  // through ?api=rounds (list) and ?api=rounds&night=yyyy-MM-dd (cards in the same shape as data.cards).
  var cardNight = '';   // '' = tonight; otherwise yyyy-MM-dd
  var past = { nights: null, at: 0, cards: {}, busy: {} };
  function pastLoad() {
    if (past.busy.list || (past.nights && Date.now() - past.at < 300000) || !window.RL || !RL.get) return;
    past.busy.list = true;
    RL.get('rounds').then(function (j) { past.nights = j.nights || []; }, function () { past.nights = past.nights || []; })
      .then(function () { past.busy.list = false; past.at = Date.now(); renderCard(); });
  }
  function pastCards(night) {
    var c = past.cards[night];
    if (c && Date.now() - c.at < 300000) return c.cards;
    if (!past.busy[night]) {
      past.busy[night] = true;
      RL.get('rounds', '&night=' + encodeURIComponent(night)).then(function (j) {
        past.cards[night] = { cards: j.cards || [], at: Date.now() };
      }, function () { past.cards[night] = { cards: c ? c.cards : [], at: Date.now(), err: true }; })
        .then(function () { past.busy[night] = false; renderCard(); });
    }
    return c ? c.cards : null;
  }
  document.getElementById('cardnight').addEventListener('change', function () { cardNight = this.value; renderCard(); });

  function renderCard() {
    pastLoad();

  return head + table;
}

function renderField() {
    var list = (data && data.field) || [];
    var sel = document.getElementById('fieldsort');
    var by = sel.value || 'net';
    var rows = list.map(function (x, i) { return { x: x, i: i }; });
    rows.sort(function (a, b) {
      var va = num(a.x[by]), vb = num(b.x[by]);
      if (va === null && vb === null) return a.i - b.i;
      if (va === null) return 1;
      if (vb === null) return -1;
      var d = by === 'pts' ? vb - va : va - vb;
      return d || a.i - b.i;
    });
    function th(key, label) { return '<th class="n' + (by === key ? ' sorted' : '') + '">' + label + '</th>'; }
    // Putting challenge (Nov 13): Low or High putts, alternating each league night. Banner on top; on the challenge
    // night, the finished player(s) with the lowest (or highest) putts get their putts highlighted.
    var pc = data && data.putts, pb = document.getElementById('puttbanner'), win = {};
    if (pb) pb.innerHTML = pc ? '<div class="card putb"><span class="putb-k">Putting challenge</span><b>' + (pc.tonight ? 'This week: ' : esc(pc.night) + ': ') +
      (pc.mode === 'High' ? 'HIGH' : 'LOW') + ' putts</b></div>' : '';
    if (pc && pc.tonight) {
      var holesN = Math.max.apply(null, [0].concat(((data && data.cards) || []).map(function (c) { return (c.holes || []).length; })));
      var done = list.filter(function (x) { return holesN && num(x.thru) !== null && num(x.thru) >= holesN && num(x.putts) !== null; });
      if (done.length) {
        var best = done.reduce(function (m, x) { var v = num(x.putts); return m === null ? v : pc.mode === 'High' ? Math.max(m, v) : Math.min(m, v); }, null);
        done.forEach(function (x) { if (num(x.putts) === best) win[x.player] = true; });
      }
    }
    document.getElementById('fieldcard').innerHTML = list.length ?
      '<table><tr><th>Player</th><th class="n">Thru</th>' + th('net', 'Net') + th('pts', 'STBF') + th('putts', 'Putts') + '</tr>' +
      rows.map(function (r) {
        var x = r.x;
        return '<tr><td>' + esc(x.player) + '</td><td class="n">' + esc(x.thru) + '</td><td class="n' + (by === 'net' ? ' b' : '') + '">' + esc(x.net) +
          '</td><td class="n' + (by === 'pts' ? ' b' : '') + '">' + esc(x.pts) + '</td><td class="n' + (by === 'putts' ? ' b' : '') + '">' + (win[x.player] ? '<span class="putw" title="Putting challenge leader">' + esc(x.putts) + '</span>' : esc(x.putts)) + '</td></tr>';
      }).join('') + '</table>' : '<div class="empty">No scores yet</div>';
  }
  (function () {
    var sel = document.getElementById('fieldsort');
    var saved = store('fieldSort');
    if (saved === 'net' || saved === 'pts' || saved === 'putts') sel.value = saved;
    sel.addEventListener('change', function () { store('fieldSort', sel.value); renderField(); });
  })();
  function render(d) {
    data = d;
    if (groupOf(curTab) === 'board' && !boardPicked() && curTab !== boardDefault()) showTab(boardDefault(), true);
    updateNav();
    document.getElementById('title').textContent = d.title || '';
    document.getElementById('updated').textContent = d.updated;
    renderTeeStrip();

    var m = d.matches.map(function (x) {
      var a = num(x.ap), b = num(x.bp);
      var la = a !== null && b !== null && a > b, lb = a !== null && b !== null && b > a;
      return '<div class="card match">' +
        '<div class="name">' + esc(x.a) + thr(x.aThru) + (x.aStrokes ? '<div class="stk">' + esc(x.aStrokes) + '</div>' : '') + '</div>' +
        '<div class="mid"><div class="scores">' +
        '<div class="pts' + (la ? ' lead' : '') + '">' + esc(x.ap || '–') + '</div>' +
        '<div class="vs">vs</div>' +
        '<div class="pts' + (lb ? ' lead' : '') + '">' + esc(x.bp || '–') + '</div>' +
        '</div>' + (x.oneWay ? '<div class="ow">One Way →</div>' : '') + '</div>' +
        '<div class="name r">' + esc(x.b) + thr(x.bThru) + (x.bStrokes ? '<div class="stk">' + esc(x.bStrokes) + '</div>' : '') + '</div>' +
        (x.even ? '<div class="thru">Even: no strokes</div>' : '') +
        (window.matchStory ? window.matchStory(x) : '') +
        '</div>';
    }).join('');
    document.getElementById('matches').innerHTML = m || '<div class="card empty">' + (d.roundType === 'Casual' ? 'Casual round: no head-to-head matches tonight' : 'No matches tonight') + '</div>';

    renderField();

    // Stats > Stats (Nov 14 redesign): Everyone / Me, in stats.js.
    if (window.renderStats) try { renderStats(d); } catch (x) { console.error(x); }

    renderNews(d);
    if (curTab === 'adminmsg' && window.renderMsg) renderMsg();
    renderTeams(d);
    if (window.ADMIN_ENTER) renderEntrySw();

    var g = d.teamGame || {};
    var tdx = d.teamDetail || {};
    document.getElementById('gameinfo').innerHTML = (d.teams.length && g.game) ?
      '<div class="card gamecard"><button type="button" class="grow" id="grulesbtn" aria-expanded="' + !!window.rulesOpen + '" aria-controls="grules">' +
      '<span class="gname">' + esc((g.scoring ? g.scoring + ' ' : '') + g.game) + '</span><span class="gmore">' + (window.rulesOpen ? 'Hide rules ▴' : 'Rules ›') + '</span></button>' +
      (g.desc ? '<div class="gdesc">' + esc(g.desc) + '</div>' : '') +
      '<div class="grules' + (window.rulesOpen ? '' : ' hide') + '" id="grules">' + (window.gameRules ? gameRules(g.game, g.scoring, tdx.minPlayers, tdx.counted) : '') + '</div></div>' : '';

    var pay = seasonPay(d.standings);
    // # column: players level on points share the place (1, 1, 3…); seed order and the top-4 shading stay as the sheet has them.
    var rank = d.standings.map(function (x, i, a) {
      var p = num(x.pts), r = i;
      if (p === null) return x.seed;
      while (r > 0 && num(a[r - 1].pts) === p) r--;
      return r + 1;
    });
    document.getElementById('table').innerHTML =
      '<table class="stand"><tr><th class="n">#</th><th>Player</th><th class="n">W-L-T</th><th class="n">Pts</th></tr>' +
      d.standings.map(function (x, i) {
        return '<tr class="' + ([1, 2, 3].indexOf(rank[i]) >= 0 ? 'place p' + rank[i] : '') + '"><td class="n">' + esc(rank[i]) +
          '</td><td>' + esc(x.player) + (pay[i] ? ' <span class="pay">' + money(pay[i]) + '</span>' : '') +
          '</td><td class="n">' + esc(x.wtl) + '</td><td class="n b">' + esc(x.pts) + '</td></tr>';
      }).join('') + '</table>' +
      '<div class="paykey">Green = payout if the regular season ended today. Players tied on points split the combined pot for the places they share.</div>';
    var payCard = function (title, amts, labels, key) {
      return '<div class="pp-t">' + title + '</div><div class="pp-row">' + labels.map(function (l, i) {
        return '<div class="pp pp' + (i + 1) + '"><div class="pp-a">' + money(amts[i]) + '</div><div class="pp-l">' + l + '</div></div>';
      }).join('') + '</div><div class="paykey">' + key + '</div>';
    };
    document.getElementById('seasonpay').innerHTML = payCard('Regular season payouts', SEASON_PAY, ['1st', '2nd', '3rd'], 'Paid on the final regular-season standings.');
    document.getElementById('playoffpay').innerHTML = payCard('Playoff payouts', PLAYOFF_PAY, ['Champion', '2nd', '3rd'], 'Paid at the end of the playoffs.');

    if (window.renderPuttStand) try { renderPuttStand(d); } catch (x) { console.error(x); }
    renderSchedule();
    renderHcp();
    renderCard();
    renderEntry();
  }

  // News tab (Nov 13): Results = the latest league night's end-of-night alerts (replaced by the next night's);
  // Announcements = every other alert from the last 3 days. Alerts sent to some players only show to them.
  function renderNews(d) {
    var n = d.news, au = window.RL && RL.user(), me = au ? au.name : '';
    var rb = document.getElementById('newsresbody'), ab = document.getElementById('newsannbody');
    if (!n) { rb.innerHTML = ab.innerHTML = '<div class="card empty">News appears once the server update is in.</div>'; return; }
    var item = function (m, own) {
      return '<div class="card nw">' + (m.title && m.title !== 'Roost Golf' ? '<div class="nw-t">' + esc(m.title) + '</div>' : '') +
        '<div class="nw-b">' + esc(m.body).replace(/\n/g, '<br>') + '</div>' +
        '<div class="nw-at">' + esc(m.at) + (own ? ' · just for you' : '') + '</div></div>';
    };
    rb.innerHTML = n.results.length ? '<div class="nw-night">' + esc(n.night) + ' · League night results</div>' + n.results.map(function (m) { return item(m); }).join('')
      : '<div class="card empty">No results yet. After the next league night, the head-to-head results, low net and putts, and the team game show up here.</div>';
    var list = n.announce.filter(function (m) { return !m.to || (me && m.to.indexOf(me) >= 0); });
    ab.innerHTML = list.length ? list.map(function (m) { return item(m, !!m.to); }).join('') + '<div class="nw-key">Announcements stay here for 3 days.</div>'
      : '<div class="card empty">No announcements in the last 3 days.</div>';
  }


  var lastLoad = 0, loadSeq = 0, shownSeq = 0;
  function load() {
    var fetchedAt = Date.now(), my = ++loadSeq;
    lastLoad = fetchedAt;
    // Nov 13: ignore a reply that comes back after a newer one (an older board would undo what's on screen).
    google.script.run.withSuccessHandler(function (d) { if (my < shownSeq) return; shownSeq = my; applyPending(d, fetchedAt); render(d); }).withFailureHandler(function () {
      document.getElementById('updated').textContent = 'just now (could not refresh)';
    }).getBoardData();
  }
  load();
  // Refresh every minute on a night with a round (Tonight's date is today), every 5 minutes otherwise,
  // and not at all while the app is in the background. Coming back refreshes straight away.
  setInterval(function () {
    if (document.hidden) return;
    var every = data && data.live === false ? 300000 : 60000;
    if (Date.now() - lastLoad >= every) load();
  }, 15000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - lastLoad > 15000) load();
  });
</script>
