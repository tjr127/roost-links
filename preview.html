<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roost Golf · phone preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e0c; color: #EDEFEA; font: 14px Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 10px; }
  .bar button { border: 1px solid #252D28; background: #181E1A; color: #9BA59E; border-radius: 999px; padding: 7px 12px; font: 600 13px inherit; cursor: pointer; }
  .bar button.on { background: #F5B13C; color: #101412; border-color: #F5B13C; }
  .bar .note { width: 100%; text-align: center; color: #9BA59E; font-size: 12px; }
  .stage { flex: 1; width: 100%; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; }
  .phone { border: 10px solid #1f2621; border-radius: 38px; overflow: hidden; background: #101412; box-shadow: 0 10px 40px rgba(0,0,0,.6); transform-origin: top center; }
  iframe { border: 0; display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <div class="stage" id="stage"><div class="phone" id="phone"><iframe id="app" src="./index.html" title="Roost Golf app"></iframe></div></div>
<script>
  // Shows the real app inside a phone-sized frame, so the phone layout (and its narrow-screen rules) can be checked on an iPad or computer.
  var sizes = [
    { name: 'Small Android', w: 360, h: 780 },
    { name: 'iPhone SE', w: 375, h: 667 },
    { name: 'iPhone 15', w: 393, h: 852 },
    { name: 'iPhone Pro Max', w: 430, h: 932 }
  ];
  var cur = 2;
  try { var sv = localStorage.getItem('previewSize'); if (sv !== null && sizes[Number(sv)]) cur = Number(sv); } catch (e) {}
  var bar = document.getElementById('bar');
  function draw() {
    bar.innerHTML = sizes.map(function (s, i) { return '<button data-i="' + i + '" class="' + (i === cur ? 'on' : '') + '">' + s.name + ' · ' + s.w + '</button>'; }).join('') +
      '<button data-reload>↻ Reload</button><div class="note">Preview only: this is the live app in a ' + sizes[cur].w + '×' + sizes[cur].h + ' frame, scaled to fit.</div>';
    fit();
  }
  function fit() {
    var s = sizes[cur], ph = document.getElementById('phone');
    ph.style.width = s.w + 'px'; ph.style.height = s.h + 'px';
    var st = document.getElementById('stage');
    var k = Math.min(1, (st.clientHeight - 10) / (s.h + 20), (st.clientWidth - 20) / (s.w + 20));
    ph.style.transform = 'scale(' + k + ')';
  }
  bar.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-reload')) { document.getElementById('app').contentWindow.location.reload(); return; }
    cur = Number(b.getAttribute('data-i'));
    try { localStorage.setItem('previewSize', cur); } catch (e2) {}
    draw();
  });
  window.addEventListener('resize', fit);
  draw();
</script>
</body>
</html>
